<script>
const initialIncome=[{"source":"Falcon House","frequency":"Monthly","expected":2000},{"source":"AMG Rapid Response","frequency":"Weekly","expected":480},{"source":"Voyage Saltbank","frequency":"Monthly estimate","expected":200}];
const initialPayments=[
{"account":"Santander","name":"Petplan insurance","amount":19.99,"status":"Active","include":"Include","notes":""},{"account":"Santander","name":"DVLA vehicle tax","amount":17.06,"status":"Active","include":"Include","notes":""},{"account":"Santander","name":"ChatGPT Go","amount":6.99,"status":"Active","include":"Include","notes":""},{"account":"Lloyds","name":"Legal & General life insurance","amount":50.26,"status":"Active","include":"Include","notes":""},{"account":"Lloyds","name":"Tails.com dog food","amount":41.76,"status":"Active","include":"Include","notes":""},{"account":"Lloyds","name":"Google storage","amount":7.99,"status":"Active","include":"Include","notes":""},{"account":"Lloyds","name":"Sure Store storage","amount":132.2,"status":"Active","include":"Include","notes":""},{"account":"Lloyds","name":"Capital One credit card","amount":180,"status":"Active","include":"Include","notes":""},{"account":"Lloyds","name":"Virgin credit card","amount":80,"status":"Active","include":"Include","notes":""},{"account":"Lloyds","name":"Admiral insurance","amount":186.27,"status":"Active","include":"Include","notes":""},{"account":"Lloyds","name":"Aviva income protection","amount":49.33,"status":"Active","include":"Include","notes":""},{"account":"Lloyds","name":"PlayStation","amount":8,"status":"Cancel planned","include":"Exclude after cancellation","notes":"Remove from recurring budget when cancellation takes effect"},{"account":"Lloyds","name":"V12 bed finance","amount":89,"status":"Active","include":"Include","notes":""},{"account":"Lloyds","name":"Vodafone","amount":31,"status":"Active","include":"Include","notes":""},{"account":"Lloyds","name":"FNB South African credit card","amount":109,"status":"Deferred this month","include":"Exclude this month only","notes":"Still owed; already with debt collection"},{"account":"Lloyds","name":"HMRC","amount":250,"status":"Review/defer this month","include":"Exclude this month provisionally","notes":"Contact HMRC before reducing/missing agreed payment"},{"account":"Family","name":"Payment to Rees (regular children’s costs incl. school fees)","amount":2700,"status":"Active","include":"Include","notes":"Replaces previous £1,595"},{"account":"Living costs","name":"Fuel","amount":100,"status":"Estimate","include":"Include","notes":""},{"account":"Living costs","name":"Food and toiletries","amount":150,"status":"Estimate","include":"Include","notes":""},{"account":"Living costs","name":"Gym membership","amount":23,"status":"Estimate","include":"Include","notes":""},{"account":"School extras","name":"Provision for school extras","amount":100,"status":"Estimate","include":"Include","notes":"£300 every 3 months"},{"account":"One-off","name":"Travel Counsellors","amount":90,"status":"One-off this month","include":"Include","notes":"Not recurring"},{"account":"Accommodation","name":"Accommodation / campsite / room","amount":0,"status":"Unknown","include":"Include","notes":"Update when known"}

const STORAGE='anthonyBudgetApp_v2';
const oldKey='anthonyBudgetApp_v1';
const now=new Date();const monthKey=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');

const clone=x=>JSON.parse(JSON.stringify(x));
let store;let current=monthKey(now);let data;
function seedMonth(){return {income:clone(initialIncome),payments:clone(initialPayments).map(p=>({...p,paymentHistory:[]})),receipts:[]}}
function normalizeMonth(m){m.income=m.income||clone(initialIncome);m.payments=m.payments||clone(initialPayments);m.receipts=m.receipts||[];m.transactions=m.transactions||[];m.payments.forEach(p=>{if(!Array.isArray(p.paymentHistory)){p.paymentHistory=[];if(Number(p.paid)>0)p.paymentHistory.push({amount:Number(p.paid),date:p.date||'',notes:'Previously recorded payment'});} });return m}

  let old=null;try{old=JSON.parse(localStorage.getItem(oldKey)||'null')}catch(e){}
  store={months:{},goals:[]};
  if(old&&old.income&&old.payments){let m=normalizeMonth({income:old.income,payments:old.payments,receipts:old.receipts||[]});store.months[current]=m;}

if(!Object.keys(store.months).length)store.months[current]=seedMonth();

function sync(){data=store.months[current];}
sync();
function persist(){store.months[current]=data;localStorage.setItem(STORAGE,JSON.stringify(store));render()}
function money(n){return new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP'}).format(Number(n)||0)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function monthly(i){let n=Number(i.expected)||0;return /weekly/i.test(i.frequency)?n*52/12:/fortnight/i.test(i.frequency)?n*26/12:/daily/i.test(i.frequency)?n*260/12:n}
function paidAmount(p){return (p.paymentHistory||[]).reduce((s,x)=>s+(Number(x.amount)||0),0)}
function totalIncome(){return data.income.reduce((s,i)=>s+monthly(i),0)}
function dueTotal(){return data.payments.filter(p=>p.include==='Include'&&p.status!=='Cancelled').reduce((s,p)=>s+(Number(p.amount)||0),0)}

function graphMonths() {
  const keys = Object.keys(store.months).sort();
  if (graphSettings.period === 'current') return keys.includes(current) ? [current] : [];
  if (graphSettings.period === '3') return keys.slice(-3);
  if (graphSettings.period === '6') return keys.slice(-6);
  if (graphSettings.period === '12') return keys.slice(-12);
  return keys;
}

function graphRecords() {
  const keys = graphMonths();
  const records = [];

  keys.forEach(k => {
    const m = store.months[k];
    const label = monthLabel(k);

    if (graphSettings.metric === 'payments-category' ||
        graphSettings.metric === 'payments-item') {
      const groups = {};
      m.payments.forEach(p => {
        const name = graphSettings.metric === 'payments-item'
          ? p.name : (p.account || 'Uncategorised');
        groups[name] = (groups[name] || 0) + paidAmount(p);
      });
      Object.entries(groups).forEach(([name, value]) =>
        records.push({label: name, value, month: k, monthLabel: label})
      );
    }

    if (graphSettings.metric === 'income-source') {
      const groups = {};
      m.receipts.forEach(r => {
        groups[r.source || 'Other'] =
          (groups[r.source || 'Other'] || 0) + (Number(r.actual) || 0);
      });
      Object.entries(groups).forEach(([name, value]) =>
        records.push({label: name, value, month: k, monthLabel: label})
      );
    }

    if (graphSettings.metric === 'monthly-comparison') {
      records.push({
        label,
        value: m.receipts.reduce((s, r) => s + (Number(r.actual) || 0), 0),
        second: m.payments.reduce((s, p) => s + paidAmount(p), 0),
        month: k,
        monthLabel: label
      });
    }

    if (graphSettings.metric === 'budget-actual') {
      records.push({
        label,
        value: m.payments
          .filter(p => p.include === 'Include' && p.status !== 'Cancelled')
          .reduce((s, p) => s + (Number(p.amount) || 0), 0),
        second: m.payments.reduce((s, p) => s + paidAmount(p), 0),
        month: k,
        monthLabel: label
      });
    }

    if (graphSettings.metric === 'transactions') {
      const groups = {};
      (m.transactions || []).filter(t => t.allocated).forEach(t => {
        const name = t.allocationLabel || 'Other';
        groups[name] = (groups[name] || 0) + Math.abs(Number(t.amount) || 0);
      });
      Object.entries(groups).forEach(([name, value]) =>
        records.push({label: name, value, month: k, monthLabel: label})
      );
    }
  });

  if (graphSettings.metric === 'goals') {
    store.goals.forEach(g => records.push({
      label: g.title,
      value: goalSaved(g),
      second: Number(g.target) || 0
    }));
  }

  return records.filter(r => graphSettings.category === 'all' ||
    r.label === graphSettings.category);
}

function drawBudgetGraph(records) {
  const type = graphSettings.type;
  const paired = ['monthly-comparison', 'budget-actual'].includes(graphSettings.metric);
  const moneyValue = n => money(n || 0);
  const colours = ['#2457d6','#087847','#7045b8','#d97706',
                   '#b42332','#0891b2','#64748b','#db2777'];

  if (!records.length) {
    return '<div class="empty">No data available for this selection yet.</div>';
  }

  if (type === 'pie' || type === 'doughnut') {
    const pieRecords = records.filter(r => r.value > 0);
    const total = pieRecords.reduce((s, r) => s + r.value, 0);
    if (!total) return '<div class="empty">No positive values to chart.</div>';

    let angle = 0;
    const slices = pieRecords.map((r, i) => {
      const start = angle;
      angle += r.value / total * 360;
      return `${colours[i % colours.length]} ${start}deg ${angle}deg`;
    });
    const stops = slices.join(', ');
    const hole = type === 'doughnut' ? '50%' : '0%';

    return `<div style="display:flex;flex-wrap:wrap;gap:22px;align-items:center;justify-content:center;padding:15px 0">
      <div style="width:min(230px,65vw);aspect-ratio:1;border-radius:50%;background:conic-gradient(${stops});position:relative">
        ${type === 'doughnut' ? `<div style="position:absolute;inset:25%;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center;padding:5px"><div><b>${moneyValue(total)}</b><div class="muted">Total</div></div></div>` : ''}
      </div>
      <div style="flex:1;min-width:160px">
        ${pieRecords.map((r,i)=>`<div class="historyrow" style="align-items:center">
          <span><span style="display:inline-block;width:11px;height:11px;border-radius:3px;background:${colours[i % colours.length]};margin-right:7px"></span>${esc(r.label)}</span>
          <b>${moneyValue(r.value)}</b>
        </div>`).join('')}
      </div>
    </div>`;
  }

  if (type === 'line') {
    const values = records.map(r => r.value);
    const max = Math.max(1, ...values, ...(paired ? records.map(r => r.second || 0) : []));
    const width = 600, height = 240, pad = 35;
    const x = i => records.length < 2 ? width / 2 :
      pad + i * (width - pad * 2) / (records.length - 1);
    const y = v => height - pad - (v / max) * (height - pad * 2);
    const points = vals => vals.map((v,i) => `${x(i)},${y(v)}`).join(' ');

    return `<div style="overflow-x:auto">
      <svg viewBox="0 0 ${width} ${height}" role="img" aria-label="Line chart" style="width:100%;min-width:300px;display:block">
        ${[0,.25,.5,.75,1].map(f=>`<line x1="${pad}" y1="${y(max*f)}" x2="${width-pad}" y2="${y(max*f)}" stroke="var(--line)" stroke-width="1"/>`).join('')}
        <polyline points="${points(values)}" fill="none" stroke="#2457d6" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
        ${records.map((r,i)=>`<circle cx="${x(i)}" cy="${y(r.value)}" r="4" fill="#2457d6"><title>${esc(r.label)}: ${moneyValue(r.value)}</title></circle>`).join('')}
        ${paired ? `<polyline points="${points(records.map(r=>r.second||0))}" fill="none" stroke="#087847" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>` : ''}
        ${records.map((r,i)=>`<text x="${x(i)}" y="${height-8}" fill="var(--muted)" font-size="11" text-anchor="middle">${esc((r.label || '').slice(0,10))}</text>`).join('')}
      </svg>
      ${paired ? '<p class="muted"><span style="color:#2457d6">● First value</span> &nbsp; <span style="color:#087847">● Second value</span></p>' : ''}
      ${records.map(r=>`<div class="historyrow"><span>${esc(r.label)}</span><b>${moneyValue(r.value)}${paired ? ' / '+moneyValue(r.second) : ''}</b></div>`).join('')}
    </div>`;
  }

  const max = Math.max(1, ...records.map(r => Math.max(r.value || 0, paired ? r.second || 0 : 0)));
  return records.map(r => `
    <div style="margin:15px 0">
      <div class="itemtop"><b>${esc(r.label)}</b><span>${moneyValue(r.value)}${paired ? ' / '+moneyValue(r.second) : ''}</span></div>
      <div class="bar"><span style="width:${Math.max(0,Math.min(100,(r.value || 0)/max*100))}%"></span></div>
      ${paired ? `<div class="bar"><span style="width:${Math.max(0,Math.min(100,(r.second || 0)/max*100))}%;background:var(--green)"></span></div>` : ''}
    </div>`).join('');
}

let pendingCsvText='';
function parseCSV(text){
  const rows=[];let row=[],field='',quoted=false;
  text=text.replace(/^\uFEFF/,'');
  for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(c==='"'){if(quoted&&n==='"'){field+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(field);field=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&n==='\n')i++;row.push(field);if(row.some(v=>v.trim()!==''))rows.push(row);row=[];field=''}else field+=c}
  row.push(field);if(row.some(v=>v.trim()!==''))rows.push(row);return rows;
}
function showCsvMapping(text){
  pendingCsvText=text;const rows=parseCSV(text);if(rows.length<2){alert('This CSV does not appear to contain transaction rows.');return}
  const headers=rows[0].map((h,i)=>h.trim()||('Column '+(i+1)));
  const opts=(label,defaultIndex,allowBlank=false)=>`<label>${label}<select id="csv-${label.replace(/[^a-z]/gi,'').toLowerCase()}">${allowBlank?'<option value="">— not used —</option>':''}${headers.map((h,i)=>`<option value="${i}" ${i===defaultIndex?'selected':''}>${esc(h)}</option>`).join('')}</select></label>`;
  const find=(patterns)=>headers.findIndex(h=>patterns.some(p=>p.test(h)));
  document.getElementById('csvMapping').innerHTML=`<h3>Match the statement columns</h3><p class="muted">Check these selections before importing. Use either a signed Amount column or separate Money In and Money Out columns.</p><div class="formgrid">${opts('Date',find([/date/i]),false)}${opts('Description',find([/description|details|reference|transaction/i]),false)}${opts('Amount',find([/^amount$|transaction amount/i]),true)}${opts('Money In',find([/money in|paid in|credit|deposit/i]),true)}${opts('Money Out',find([/money out|paid out|debit|withdrawal/i]),true)}</div><div class="actions"><button class="primary" onclick="confirmCsvImport()">Import transactions</button><button class="secondary" onclick="document.getElementById('csvMapping').innerHTML=''">Cancel</button></div><p class="muted">${rows.length-1} rows detected. Existing transactions are kept; duplicates are not automatically removed.</p>`;
}
function parseAmount(v){if(v==null)return 0;let s=String(v).trim().replace(/[£$€,\s]/g,'');if(!s||s==='-')return 0;let neg=s.startsWith('(')&&s.endsWith(')');s=s.replace(/[()]/g,'');let n=Number(s);return Number.isFinite(n)?(neg?-n:n):0}
function confirmCsvImport(){
 const rows=parseCSV(pendingCsvText);if(rows.length<2)return;
 const col=id=>{const e=document.getElementById('csv-'+id);return e&&e.value!==''?Number(e.value):-1};
 const dateCol=col('date'),descCol=col('description'),amountCol=col('amount'),inCol=col('moneyin'),outCol=col('moneyout');
 if(dateCol<0||descCol<0||(amountCol<0&&inCol<0&&outCol<0)){alert('Please select date and description columns, plus an amount column or money-in/out columns.');return}
 const seen=new Set((data.transactions||[]).map(t=>t.fingerprint));
 let added=0,duplicates=0;
 rows.slice(1).forEach((r,i)=>{const date=(r[dateCol]||'').trim(),description=(r[descCol]||'').trim();if(!date&&!description)return;
 let amount=amountCol>=0?parseAmount(r[amountCol]):parseAmount(r[inCol])-parseAmount(r[outCol]);
 const fp=[date,description,amount.toFixed(2)].join('|');if(seen.has(fp)){duplicates++;return}
 data.transactions.push({id:'tx'+Date.now()+'_'+i+'_'+Math.random().toString(36).slice(2,7),date,description,amount,fingerprint:fp,allocated:false});seen.add(fp);added++;
 });
 persist();alert(`Imported ${added} transactions.${duplicates?' Skipped '+duplicates+' possible duplicates already in this month.':''}`);
}
function allocationOptions(t){
 let html='<option value="">Choose allocation…</option>';
 if(t.amount<0){html+='<optgroup label="Bills and payments">'+data.payments.map((p,i)=>`<option value="payment:${i}">${esc(p.name)} · ${esc(p.account||'')}</option>`).join('')+'</optgroup>';
 html+='<optgroup label="Savings goals">'+store.goals.map((g,i)=>`<option value="goal:${i}">${esc(g.title)}</option>`).join('')+'</optgroup>';
 }else{html+='<optgroup label="Income sources">'+data.income.map((x,i)=>`<option value="income:${i}">${esc(x.source)}</option>`).join('')+'</optgroup>';
 html+='<optgroup label="Savings goals">'+store.goals.map((g,i)=>`<option value="goal:${i}">${esc(g.title)} (contribution)</option>`).join('')+'</optgroup>'}
 html+='<option value="other">Other / transfer / do not include in budget</option>';return html;
}
function allocateTransaction(id){
 const t=data.transactions.find(x=>x.id===id);if(!t||t.allocated)return;
 const sel=document.getElementById('alloc-'+id),value=sel&&sel.value;if(!value){alert('Choose an allocation first.');return}
 const note=document.getElementById('allocnote-'+id)?.value||'';
 const [type,indexText]=value.split(':');const index=Number(indexText);t.allocationType=type;t.allocationIndex=type==='other'?-1:index;t.allocationLabel=type==='other'?'Other / transfer':type==='payment'?data.payments[index]?.name:type==='income'?data.income[index]?.source:store.goals[index]?.title;
 if(type==='payment'){
  const p=data.payments[index];if(!p){alert('That payment item no longer exists.');return}
  p.paymentHistory=p.paymentHistory||[];p.paymentHistory.push({amount:Math.abs(t.amount),date:t.date,notes:note||'Imported bank statement',transactionId:t.id});
  p.paid=paidAmount(p);p.date=t.date;
 }else if(type==='income'){
  const src=data.income[index];if(!src){alert('That income source no longer exists.');return}
  data.receipts.push({date:t.date,source:src.source,expected:0,actual:Math.abs(t.amount),notes:note||'Imported bank statement',transactionId:t.id});
 }else if(type==='goal'){
  const g=store.goals[index];if(!g){alert('That goal no longer exists.');return}
  g.contributions=g.contributions||[];g.contributions.push({amount:Math.abs(t.amount),date:t.date,notes:note||'Imported bank statement',month:current,transactionId:t.id});
 }
 t.allocated=true;t.allocatedAt=new Date().toISOString();persist();
}
function undoAllocation(id){
 const t=data.transactions.find(x=>x.id===id);if(!t||!t.allocated)return;
 if(!confirm('Undo this allocation? The linked payment, receipt or goal contribution will also be removed.'))return;
 if(t.allocationType==='payment'){const p=data.payments[t.allocationIndex];if(p){p.paymentHistory=(p.paymentHistory||[]).filter(x=>x.transactionId!==id);p.paid=paidAmount(p)}}
 else if(t.allocationType==='income')data.receipts=data.receipts.filter(x=>x.transactionId!==id);
 else if(t.allocationType==='goal'){const g=store.goals[t.allocationIndex];if(g)g.contributions=(g.contributions||[]).filter(x=>x.transactionId!==id)}
 t.allocated=false;delete t.allocatedAt;delete t.allocationType;delete t.allocationIndex;delete t.allocationLabel;persist();
}
function removeTransaction(id){if(confirm('Remove this imported transaction?')){data.transactions=data.transactions.filter(t=>t.id!==id);persist()}}

function addIncome(){data.income.push({source:'New income',frequency:'Monthly',expected:0});persist()}
function deleteIncome(n){if(confirm('Remove this income source from this month?')){data.income.splice(n,1);persist()}}
function addPayment(){data.payments.push({account:'Other',name:'New payment',amount:0,status:'Active',include:'Include',notes:'',paymentHistory:[]});persist()}
function deletePayment(n){if(confirm('Remove this payment item and its history from this month?')){data.payments.splice(n,1);persist()}}
function movePayment(n,delta){let j=n+delta;if(j<0||j>=data.payments.length)return;[data.payments[n],data.payments[j]]=[data.payments[j],data.payments[n]];persist()}
function addInstalment(n){let p=data.payments[n];let amount=prompt('Amount paid towards '+p.name+' (£):');if(amount===null)return;amount=Number(amount);if(!Number.isFinite(amount)||amount<=0){alert('Enter an amount greater than £0.');return}let date=prompt('Date paid (YYYY-MM-DD):',new Date().toISOString().slice(0,10));if(date===null)return;let notes=prompt('Optional note (or leave blank):','')||'';p.paymentHistory=p.paymentHistory||[];p.paymentHistory.push({amount,date,notes});p.paid=paidAmount(p);p.date=date;persist()}
function deleteInstalment(n,j){if(confirm('Delete this instalment?')){data.payments[n].paymentHistory.splice(j,1);data.payments[n].paid=paidAmount(data.payments[n]);persist()}}
function addGoal(){let title=document.getElementById('goalTitle').value.trim(),target=Number(document.getElementById('goalTarget').value),notes=document.getElementById('goalNotes').value.trim();if(!title||!Number.isFinite(target)||target<=0){alert('Enter a goal title and target amount greater than £0.');return}store.goals.push({id:Date.now(),title,target,notes,contributions:[]});localStorage.setItem(STORAGE,JSON.stringify(store));render('goals')}
function editGoal(n){let g=store.goals[n],title=prompt('Goal title:',g.title);if(title===null)return;let target=prompt('Target amount (£):',g.target);if(target===null)return;target=Number(target);if(!title.trim()||!Number.isFinite(target)||target<=0){alert('Enter a valid title and target amount.');return}g.title=title.trim();g.target=target;let notes=prompt('Notes:',g.notes||'');if(notes!==null)g.notes=notes;localStorage.setItem(STORAGE,JSON.stringify(store));render('goals')}
function deleteGoal(n){if(confirm('Delete this goal and its contribution history?')){store.goals.splice(n,1);localStorage.setItem(STORAGE,JSON.stringify(store));render('goals')}}
function addContribution(n){let g=store.goals[n],amount=prompt('How much are you adding to '+g.title+'? (£)');if(amount===null)return;amount=Number(amount);if(!Number.isFinite(amount)||amount<=0){alert('Enter an amount greater than £0.');return}let date=prompt('Date added (YYYY-MM-DD):',new Date().toISOString().slice(0,10));if(date===null)return;let notes=prompt('Optional note (or leave blank):','')||'';g.contributions=g.contributions||[];g.contributions.push({amount,date,notes,month:current});localStorage.setItem(STORAGE,JSON.stringify(store));render('goals')}
function deleteContribution(n,j){if(confirm('Delete this contribution?')){store.goals[n].contributions.splice(j,1);localStorage.setItem(STORAGE,JSON.stringify(store));render('goals')}}
function addReceipt(){let actual=document.getElementById('ractual').value;if(actual===''){alert('Enter the amount received.');return}data.receipts.push({date:document.getElementById('rdate').value,source:document.getElementById('rsource').value,expected:document.getElementById('rexpected').value,actual,notes:document.getElementById('rnotes').value});persist()}
function deleteReceipt(n){if(confirm('Delete this receipt entry?')){data.receipts.splice(n,1);persist()}}
function backup(){store.months[current]=data;download('anthony-budget-full-backup.json',JSON.stringify(store,null,2),'application/json')}
function exportCSV(){let rows=[['Date','Source','Expected','Actual','Difference','Notes'],...data.receipts.map(r=>[r.date,r.source,r.expected,r.actual,(Number(r.actual)||0)-(Number(r.expected)||0),r.notes])];download('anthony-income-'+current+'.csv',rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv')}
function download(name,content,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function restore(){let f=document.getElementById('restoreFile').files[0];if(!f){alert('Choose a JSON backup first.');return}let reader=new FileReader();reader.onload=()=>{try{let d=JSON.parse(reader.result);if(!d.months||!d.goals)throw Error();store=d;Object.keys(store.months).forEach(k=>store.months[k]=normalizeMonth(store.months[k]));if(!store.months[current])current=Object.keys(store.months).sort().slice(-1)[0];sync();localStorage.setItem(STORAGE,JSON.stringify(store));monthOptions();render('home');alert('Backup restored.')}catch(e){alert('That file is not a valid full budget app backup.')}};reader.readAsText(f)}
function resetApp(){if(confirm('Reset all months, goals and entries on this device? Export a backup first if you want to keep them.')){store={months:{[monthKey(now)]:seedMonth()},goals:[]};current=monthKey(now);sync();localStorage.setItem(STORAGE,JSON.stringify(store));monthOptions();render('home')}}
function toggleHelper(){document.getElementById('helperPanel').classList.toggle('open')}
function askBuddy(){let q=document.getElementById('helperQuestion').value.trim();if(!q){alert('Type a question first.');return}let full='I am using a personal budget app. Please help me with this question: '+q;window.open('https://chatgpt.com/?q='+encodeURIComponent(full),'_blank');}
localStorage.setItem(STORAGE,JSON.stringify(store));monthOptions();render();
</script>
