<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Financial Freedom · Macrae Budget</title><style>:root{--bg:#f3f6fb;--card:#fff;--ink:#172033;--muted:#596579;--line:#dce3ee;--blue:#2457d6;--green:#087847;--red:#b42332;--gold:#8a5700}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}main{max-width:900px;margin:auto;padding:18px 14px 60px}h1{font-family:Georgia,serif;margin:0}.muted{color:var(--muted);font-size:.88rem}.panel,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px;margin:12px 0}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.metric{font-size:1.65rem;font-weight:850;margin-top:5px}.positive{color:var(--green)}.negative{color:var(--red)}label{display:block;font-size:.82rem;color:var(--muted);font-weight:650}input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--card);color:var(--ink);font:inherit;margin-top:5px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.bar{height:14px;background:var(--line);border-radius:20px;overflow:hidden;margin-top:9px}.bar span{display:block;height:100%;background:var(--blue)}button{border:0;background:var(--blue);color:#fff;border-radius:12px;padding:12px 15px;font:inherit;font-weight:750}.debt{padding:13px 0;border-bottom:1px solid var(--line)}.debt:last-child{border-bottom:0}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.badge{font-size:.75rem;padding:4px 8px;border-radius:999px;background:#e8efff;color:var(--blue);font-weight:800}@media(max-width:520px){.cards,.formgrid{grid-template-columns:1fr}.row{align-items:flex-start}.metric{font-size:1.5rem}}</style></head><body><main><div class="row"><div><h1>💷 Financial Freedom</h1><div class="muted">Debt reduction, breathing room and your route towards accommodation.</div></div><button onclick="location.href='index.html'">← Budget</button></div><div id="app"></div></main><script>const STORAGE='anthonyBudgetApp_v2';let store;try{store=JSON.parse(localStorage.getItem(STORAGE)||'null')}catch(e){store=null}const money=n=>new Intl.NumberFormat('en-GB',{style:'currency',currency:'GBP'}).format(Number(n)||0);const paid=p=>(p.paymentHistory||[]).reduce((s,x)=>s+(Number(x.amount)||0),0);const total=p=>Math.max(0,(Number(p.amount)||0)+(Number(p.rolloverAmount)||0));const monthly=i=>{let n=Number(i.expected)||0;return /weekly/i.test(i.frequency)?n*52/12:/fortnight/i.test(i.frequency)?n*26/12:/daily/i.test(i.frequency)?n*260/12:n};function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){if(!store){document.getElementById('app').innerHTML='<div class="panel">No budget data found on this device. Open the Budget App first.</div>';return}let keys=Object.keys(store.months||{}).sort();let current=keys[keys.length-1];let d=store.months[current];let income=(d.income||[]).reduce((s,i)=>s+monthly(i),0);let included=(d.payments||[]).filter(p=>p.include==='Include'&&p.status!=='Cancelled');let committed=included.reduce((s,p)=>s+total(p),0);let debtTerms=['credit card','finance','hmrc','debt','loan','capital one','virgin'];let debts=included.filter(p=>debtTerms.some(t=>(p.name+' '+(p.notes||'')).toLowerCase().includes(t)));let debtMonthly=debts.reduce((s,p)=>s+Number(p.amount||0),0);let breathing=income-committed;document.getElementById('app').innerHTML=`<div class="cards"><div class="card"><div class="muted">Monthly income</div><div class="metric">${money(income)}</div></div><div class="card"><div class="muted">Committed plan</div><div class="metric">${money(committed)}</div></div><div class="card"><div class="muted">Current breathing room</div><div class="metric ${breathing<0?'negative':'positive'}">${money(breathing)}</div></div><div class="card"><div class="muted">Debt payments identified</div><div class="metric negative">${money(debtMonthly)}</div></div></div><div class="panel"><h2>🎯 Lump-sum debt calculator</h2><p class="muted">Enter an amount you could put towards debt. This ranks the debts by the monthly payment that would disappear if that debt were fully cleared. It does not change your budget.</p><div class="formgrid"><label>Lump sum available (£)<input id="lump" type="number" min="0" step="1" value="2000"></label><label>Minimum cash buffer (£)<input id="buffer" type="number" min="0" step="50" value="500"></label></div><div id="scenario" style="margin-top:14px"></div></div><div class="panel"><h2>🚗 Safety before speed</h2><p>Because your car is your transport and currently part of your living setup, the calculator keeps a cash-buffer option visible rather than assuming every spare pound should go to debt.</p><div class="row"><span>Suggested first buffer</span><b>${money(1000)}</b></div><div class="row"><span>Stronger buffer</span><b>${money(1500)}</b></div></div><div class="panel"><h2>💳 Debt attack order</h2>${debts.length?debts.sort((a,b)=>Number(b.amount||0)-Number(a.amount||0)).map(p=>`<div class="debt"><div class="row"><div><b>${esc(p.name)}</b><div class="muted">${esc(p.account||'')} · ${esc(p.status||'')}</div></div><span class="badge">${money(p.amount)}/month</span></div></div>`).join(''):'<div class="muted">No obvious debt items were identified automatically. You can still use the calculator above once debt items are clearly labelled in Payments.</div>'}</div><div class="panel"><h2>🏠 The goal</h2><p class="muted">The aim isn't simply “zero debt”. It's to reduce the monthly commitments enough that you can afford somewhere to stay while keeping enough cash aside to prevent one car problem from putting you back into crisis.</p></div>`;function update(){let lump=Math.max(0,Number(document.getElementById('lump').value)||0),buffer=Math.max(0,Number(document.getElementById('buffer').value)||0);let usable=Math.max(0,lump-buffer);let ranked=debts.map(p=>({p,monthly:Number(p.amount)||0,balance:total(p)})).filter(x=>x.balance>0&&x.monthly>0).sort((a,b)=>b.monthly-a.monthly);let pick=ranked.find(x=>x.balance<=usable);if(!pick)pick=ranked[0];let s=document.getElementById('scenario');if(!pick){s.innerHTML='<div class="muted">No eligible debt items found.</div>';return}if(pick.balance<=usable){s.innerHTML=`<div class="panel" style="margin:0;border-left:6px solid var(--green)"><b>Best target with your usable lump sum:</b> ${esc(pick.p.name)}<div class="row" style="margin-top:8px"><span>Amount needed to clear</span><b>${money(pick.balance)}</b></div><div class="row"><span>Monthly payment released</span><b class="positive">${money(pick.monthly)}</b></div><div class="row"><span>New breathing room</span><b class="positive">${money(breathing+pick.monthly)}</b></div></div>`}else{s.innerHTML=`<div class="panel" style="margin:0;border-left:6px solid var(--gold)"><b>Best monthly-cashflow target:</b> ${esc(pick.p.name)}<div class="muted" style="margin-top:6px">You could put ${money(usable)} towards it, but that would not necessarily clear the balance, so the monthly payment may not disappear yet.</div></div>`}}document.getElementById('lump').addEventListener('input',update);document.getElementById('buffer').addEventListener('input',update);update()}render();</script></body></html>
