name: Upgrade Payments status display
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  upgrade:
    if: "!contains(github.event.head_commit.message, '[payments-status-upgraded]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Payments screen
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html');s=p.read_text(encoding='utf-8')
          if 'payment-status-upgrade-v1' in s: raise SystemExit(0)
          css='''
          /* payment-status-upgrade-v1 */
          .payment-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:12px 0 15px}.payment-summary-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}.payment-summary-card .summary-label{font-size:.74rem;color:var(--muted);font-weight:750}.payment-summary-card .summary-value{font-size:1.35rem;font-weight:900}.payment-summary-card .summary-money{font-size:.78rem;color:var(--muted)}.payment-summary-card.needs{border-top:4px solid var(--red)}.payment-summary-card.partial{border-top:4px solid var(--gold)}.payment-summary-card.paid{border-top:4px solid var(--green)}.payment-summary-card.cancelled{border-top:4px solid var(--muted)}.payment-filterbar{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 15px}.payment-filterbar button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:9px 12px;font:inherit;font-size:.82rem;font-weight:800}.payment-filterbar button.active{background:var(--blue);border-color:var(--blue);color:#fff}.payment-status{display:inline-flex;border-radius:999px;padding:5px 9px;font-size:.76rem;font-weight:900;margin-top:7px}.payment-status.needs{background:var(--red-soft);color:var(--red)}.payment-status.partial{background:var(--gold-soft);color:var(--gold)}.payment-status.paid{background:var(--green-soft);color:var(--green)}.payment-status.cancelled{background:var(--line);color:var(--muted)}.payment-entry.status-needs{border-left-color:var(--red)}.payment-entry.status-partial{border-left-color:var(--gold)}.payment-entry.status-paid{border-left-color:var(--green)}.payment-entry.status-cancelled{border-left-color:var(--muted);opacity:.78}.payment-progress{height:9px;border-radius:20px;background:var(--line);overflow:hidden;margin-top:8px}.payment-progress span{display:block;height:100%;border-radius:20px;background:var(--green)}.payment-progress.partial span{background:var(--gold)}.payment-status-note{margin-top:5px;font-size:.78rem;color:var(--muted)}@media(max-width:650px){.payment-summary{grid-template-columns:repeat(2,minmax(0,1fr))}}
          '''
          s=s.replace('</style>',css+'</style>',1)
          old="function paidAmount(p){return (p.paymentHistory||[]).reduce((s,x)=>s+(Number(x.amount)||0),0)}"
          extra='''
          function paymentProgress(p){const amount=Math.max(0,Number(p.amount)||0),paid=Math.max(0,paidAmount(p));if(p.status==='Cancelled')return {key:'cancelled',label:'Cancelled',paid,amount,remaining:0,pct:0};if(amount<=0)return {key:'needs',label:'Needs amount',paid,amount,remaining:0,pct:0};const remaining=Math.max(0,amount-paid),pct=Math.min(100,paid/amount*100);if(remaining<=0)return {key:'paid',label:'Paid in full',paid,amount,remaining:0,pct:100};if(paid>0)return {key:'partial',label:'Part-paid',paid,amount,remaining,pct};return {key:'needs',label:'Needs payment',paid:0,amount,remaining:amount,pct:0}}
          let paymentFilter='all';function setPaymentFilter(f){paymentFilter=f;render('payments')}function markPaymentPaid(n){const p=data.payments[n],st=paymentProgress(p);if(!p||st.key==='cancelled'||st.remaining<=0)return;const date=new Date().toISOString().slice(0,10);p.paymentHistory=p.paymentHistory||[];p.paymentHistory.push({amount:st.remaining,date,notes:'Marked paid in full'});p.paid=paidAmount(p);p.date=date;p.status='Paid';persist()}
          '''
          if old not in s: raise SystemExit('paidAmount not found')
          s=s.replace(old,old+extra,1)
          a=s.find("}else if(tab==='payments'){");b=s.find("}else if(tab==='allocate'){",a)
          if a<0 or b<0: raise SystemExit('payments block not found')
          block='''}else if(tab==='payments'){
          const paymentStats=data.payments.reduce((a,p)=>{const st=paymentProgress(p);a[st.key].count++;a[st.key].paid+=st.paid;a[st.key].remaining+=st.remaining;return a},{needs:{count:0,paid:0,remaining:0},partial:{count:0,paid:0,remaining:0},paid:{count:0,paid:0,remaining:0},cancelled:{count:0,paid:0,remaining:0}});
          const paymentItems=data.payments.map((p,n)=>({p,n,st:paymentProgress(p)})).filter(x=>paymentFilter==='all'||x.st.key===paymentFilter);
          root.innerHTML=`<h2>Payments and bills · ${esc(monthLabel(current))}</h2><p class="muted">See at a glance what is <b>paid in full</b>, <b>part-paid</b>, or <b>still needs paying</b>. Status is calculated from instalments recorded.</p>
          <div class="payment-summary"><div class="payment-summary-card needs"><div class="summary-label">Needs payment</div><div class="summary-value negative">${paymentStats.needs.count}</div><div class="summary-money">${money(paymentStats.needs.remaining)} left</div></div><div class="payment-summary-card partial"><div class="summary-label">Part-paid</div><div class="summary-value" style="color:var(--gold)">${paymentStats.partial.count}</div><div class="summary-money">${money(paymentStats.partial.remaining)} left</div></div><div class="payment-summary-card paid"><div class="summary-label">Paid in full</div><div class="summary-value positive">${paymentStats.paid.count}</div><div class="summary-money">${money(paymentStats.paid.paid)} paid</div></div><div class="payment-summary-card cancelled"><div class="summary-label">Cancelled</div><div class="summary-value">${paymentStats.cancelled.count}</div><div class="summary-money">Not included</div></div></div>
          <div class="payment-filterbar" role="group" aria-label="Filter payments">${[['all','All ('+data.payments.length+')'],['needs','Needs payment ('+paymentStats.needs.count+')'],['partial','Part-paid ('+paymentStats.partial.count+')'],['paid','Paid in full ('+paymentStats.paid.count+')'],['cancelled','Cancelled ('+paymentStats.cancelled.count+')']].map(([v,l])=>`<button class="${paymentFilter===v?'active':''}" onclick="setPaymentFilter('${v}')">${l}</button>`).join('')}</div>
          <div class="actions" style="margin-bottom:10px"><button class="primary" onclick="addPayment()">＋ Add payment item</button></div><div class="panel">${paymentItems.length?paymentItems.map(({p,n,st})=>{const amount=st.amount,paid=st.paid,remaining=st.remaining,pct=st.pct;return `<div class="payment-entry status-${st.key}"><div class="itemtop"><div class="payment-heading"><div class="payment-title">${esc(p.name)}</div><div class="payment-ref">${esc(p.account||'No account/category')} · Planned ${money(amount)}</div><span class="payment-status ${st.key}">${st.key==='paid'?'✓ ':st.key==='partial'?'◐ ':st.key==='needs'?'! ':''}${st.label}</span><div class="payment-status-note">Paid ${money(paid)} · ${remaining>0?money(remaining)+' still to pay':'Nothing left to pay'}</div>${amount>0?`<div class="payment-progress ${st.key==='partial'?'partial':''}"><span style="width:${pct}%"></span></div>`:''}<div class="movecontrols"><button class="movebtn" onclick="movePayment(${n},-1)" ${n===0?'disabled':''}>↑</button><button class="movebtn" onclick="movePayment(${n},1)" ${n===data.payments.length-1?'disabled':''}>↓</button><span class="payment-ref" style="align-self:center">Reorder</span></div></div><div class="payment-balance"><span>${money(remaining)}</span><div class="payment-ref">${remaining>0?'left to pay':'complete'}</div></div></div>
          <div class="fields"><label>Item name<input value="${esc(p.name)}" onchange="data.payments[${n}].name=this.value;persist()"></label><label>Planned amount (£)<input type="number" min="0" step=".01" value="${amount}" onchange="data.payments[${n}].amount=this.value;persist()"></label><label>Account/category<input value="${esc(p.account||'')}" onchange="data.payments[${n}].account=this.value;persist()"></label><label>Bill status<select onchange="data.payments[${n}].status=this.value;persist()">${['Active','Not paid','Part-paid','Paid','Deferred','Cancelled','Estimate'].map(s=>`<option ${p.status===s?'selected':''}>${s}</option>`).join('')}</select></label><label>Payment method (optional)<select onchange="data.payments[${n}].paymentMethod=this.value;persist()"><option value="" ${!p.paymentMethod?'selected':''}>Not specified</option><option value="Direct debit" ${p.paymentMethod==='Direct debit'?'selected':''}>Direct debit</option><option value="Manual payment" ${p.paymentMethod==='Manual payment'?'selected':''}>Manual payment</option></select></label><label>Payment due date (optional)<input type="date" value="${esc(p.dueDate||'')}" onchange="data.payments[${n}].dueDate=this.value;persist()"></label></div><div class="actions"><button class="primary" onclick="addInstalment(${n})">＋ Add instalment</button>${remaining>0&&st.key!=='cancelled'?`<button class="secondary" onclick="markPaymentPaid(${n})">✓ Mark paid in full</button>`:''}<button class="secondary" onclick="deletePayment(${n})">Remove item</button></div>${(p.paymentHistory||[]).length?`<div class="history"><div class="muted"><b>Payment history</b></div>${p.paymentHistory.map((x,j)=>`<div class="historyrow"><div><b>${esc(x.date||'Date not set')}</b><div class="muted">${esc(x.notes||'Payment')}</div></div><div style="text-align:right"><b>${money(x.amount)}</b><br><button class="secondary" style="padding:4px 7px;margin-top:3px" onclick="deleteInstalment(${n},${j})">Delete</button></div></div>`).join('')}</div>`:'<div class="muted" style="margin-top:9px">No instalments recorded yet.</div>'}<div class="fields"><label>Include in monthly plan<select onchange="data.payments[${n}].include=this.value;persist()">${['Include','Exclude','Exclude this month only','Exclude after cancellation','This month only','Exclude this month provisionally'].map(s=>`<option ${p.include===s?'selected':''}>${s}</option>`).join('')}</select></label><label>Notes<input value="${esc(p.notes||'')}" onchange="data.payments[${n}].notes=this.value;persist()"></label></div></div>`}).join(''):'<div class="empty">No payments match this filter.</div>'}</div>`;
          '''
          s=s[:a]+block+s[b:]
          p.write_text(s,encoding='utf-8')
      - name: Commit upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Improve payment status tracking [payments-status-upgraded]"
          git push
